apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gaokao-analyzer.fullname" . }}
  labels:
    app.kubernetes.io/name: gaokao-analyzer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gaokao-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaokao-analyzer
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GAOKAO_ENV
              value: "{{ .Values.env.GAOKAO_ENV }}"
            - name: CORS_ORIGINS
              value: "{{ .Values.env.CORS_ORIGINS }}"
            - name: JWT_SECRET
              value: "{{ .Values.env.JWT_SECRET }}"
            - name: REDIS_URL
              value: "{{ .Values.env.REDIS_URL }}"
            - name: MEILISEARCH_URL
              value: "{{ .Values.env.MEILISEARCH_URL }}"
            - name: MEILISEARCH_API_KEY
              value: "{{ .Values.env.MEILISEARCH_API_KEY }}"
            - name: DATABASE_URL
              value: "{{ .Values.env.DATABASE_URL }}"
            - name: GAOKAO_DB
              value: "{{ .Values.env.GAOKAO_DB }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaokao-analyzer.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: gaokao-analyzer
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gaokao-analyzer.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gaokao-analyzer.fullname" . }}
                port:
                  name: http
{{- end }}
