[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gaokao-analyzer"
version = "7.1.0"
description = "AI-powered Gaokao exam analysis system with IRT measurement, multi-agent orchestration, and intelligent exam composition"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["gaokao", "education", "ai", "irt", "exam-analysis", "learning"]
authors = [
    {name = "shuangzhebai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/shuangzhebai/gaokao-analyzer"
Repository = "https://github.com/shuangzhebai/gaokao-analyzer"
Documentation = "https://shuangzhebai.github.io/gaokao-analyzer"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
