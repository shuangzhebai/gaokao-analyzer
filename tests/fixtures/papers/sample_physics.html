<!DOCTYPE html>
<html lang="zh-CN">
<head><title>2026届高三物理模拟卷（样例）</title></head>
<body>
  <h1>2026届高三物理模拟卷（样例）</h1>
  <div class="question">
    <p>1. 关于牛顿第一定律，下列说法正确的是（  ）</p>
    <p>A. 物体不受力时一定静止</p>
    <p>B. 力是维持物体运动的原因</p>
    <p>C. 一切物体都有惯性</p>
    <p>D. 速度越大惯性越大</p>
    <p>答案：C</p>
  </div>
  <div class="question">
    <p>2. 质量为 m 的物体自由下落 h 高度，重力势能减少量为（  ）</p>
    <p>A. mgh</p>
    <p>B. 1/2 mgh</p>
    <p>C. 2mgh</p>
    <p>D. 0</p>
    <p>答案：A</p>
  </div>
  <div class="question">
    <p>3. 如图所示，一质点做匀速圆周运动，半径为 r，周期为 T，求向心加速度。</p>
    <p>答案：略</p>
  </div>
</body>
</html>
