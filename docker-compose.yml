services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 跨域白名单：逗号分隔的具体来源；生产必须显式指定（如 https://app.example.com）。
      # 留空则生产环境拒绝一切跨域、dev 环境仅允许本地前端来源。禁止使用 "*" 通配符。
      CORS_ORIGINS: "http://localhost:8000"
      # API Key：生产环境【必须】设置为强密钥，禁止留空！留空将导致写接口无鉴权。
      # 以下为占位示例，部署前请替换为强随机值（如 openssl rand -hex 32）。
      API_KEY: "please-set-a-strong-key-in-prod"
      # 运行环境标识（dev=本地便利 / prod=生产强制安全）。默认 dev 保持本地可用；
      # 生产部署请设为 "prod"，届时未设置 JWT_SECRET / API_KEY 将启动失败（fail-fast）。
      GAOKAO_ENV: "dev"
      # 关闭 Python 输出缓冲，便于容器日志实时查看
      PYTHONUNBUFFERED: "1"
      # Redis 连接（P1-01）
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      MEILISEARCH_URL: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "gaokao-analyzer-master-key"
      # PostgreSQL 连接（GAOKAO_DB=postgresql 时使用）
      DATABASE_URL: "postgresql://gaokao:gaokao@postgres:5432/gaokao"
      GAOKAO_DB: "sqlite"  # 改为 postgresql 以启用 PG
    volumes:
      # 数据持久化：镜像内 DB 路径为 /app/data（与 config.DB_PATH=data/gaokao.db 一致）
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: "gaokao-analyzer-master-key"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gaokao
      POSTGRES_USER: gaokao
      POSTGRES_PASSWORD: gaokao
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  meili_data:
  pg_data:
